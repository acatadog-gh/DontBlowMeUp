<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>别炸我！卡牌美术 v3</title>
  <style>
    :root{--bg:#22484b;--ink:#fffdf6;--muted:#c9ddda}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"PingFang SC",sans-serif;color:var(--ink)}
    main{max-width:3100px;margin:auto;padding:64px 48px 80px}
    h1{margin:0;text-align:center;font-size:52px;letter-spacing:5px}
    p{margin:14px 0 42px;text-align:center;color:var(--muted);letter-spacing:2px}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px}
    figure{margin:0}
    img{display:block;width:100%;height:auto;border-radius:26px;box-shadow:0 24px 54px #0005}
    figcaption{margin-top:12px;text-align:center;color:var(--muted);font-size:16px;letter-spacing:1px}
    @media(max-width:1800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}main{padding:30px 18px}}
  </style>
</head>
<body>
<main>
  <h1>《别炸我！》完整卡牌美术 · v3</h1>
  <p>14 张牌面 + 1 张牌背 · 内页插画重绘 · 1200 × 1800 PNG</p>
  <div class="grid">
<figure><img src="png/card_bomb.png" alt="爆弹"><figcaption>爆弹 · 特殊牌 · 致命</figcaption></figure>
<figure><img src="png/card_defuse.png" alt="拆除"><figcaption>拆除 · 特殊牌 · 保命</figcaption></figure>
<figure><img src="png/card_skip.png" alt="跳过"><figcaption>跳过 · 行动牌</figcaption></figure>
<figure><img src="png/card_attack.png" alt="攻击"><figcaption>攻击 · 行动牌</figcaption></figure>
<figure><img src="png/card_peek.png" alt="预知"><figcaption>预知 · 行动牌</figcaption></figure>
<figure><img src="png/card_shuffle.png" alt="洗牌"><figcaption>洗牌 · 行动牌</figcaption></figure>
<figure><img src="png/card_steal.png" alt="偷牌"><figcaption>偷牌 · 行动牌</figcaption></figure>
<figure><img src="png/card_overdraw.png" alt="透支"><figcaption>透支 · 行动牌</figcaption></figure>
<figure><img src="png/card_nope.png" alt="休想"><figcaption>休想 · 反制牌</figcaption></figure>
<figure><img src="png/card_tiger_pliers.png" alt="老虎钳"><figcaption>老虎钳 · 收集牌 · 工具族</figcaption></figure>
<figure><img src="png/card_needle_pliers.png" alt="尖嘴钳"><figcaption>尖嘴钳 · 收集牌 · 工具族</figcaption></figure>
<figure><img src="png/card_pipe_wrench.png" alt="管钳"><figcaption>管钳 · 收集牌 · 工具族</figcaption></figure>
<figure><img src="png/card_cutter.png" alt="断线钳"><figcaption>断线钳 · 收集牌 · 工具族</figcaption></figure>
<figure><img src="png/card_hydraulic.png" alt="液压钳"><figcaption>液压钳 · 收集牌 · 工具族</figcaption></figure>
    <figure><img src="png/card_back.png" alt="牌背"><figcaption>牌背 · 别炸我！</figcaption></figure>
  </div>
</main>
</body>
</html>
